[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zacharycab-kbconflict"
version = "0.1.0"
description = "在文档集合中寻找主题相同但结论相反的陈述对，标出双方出处"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "zacharycab" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://zacharycab.github.io"
Repository = "https://github.com/zacharycab/kbconflict"
Issues = "https://github.com/zacharycab/kbconflict/issues"

[project.scripts]
kbconflict = "kbconflict:main"

[tool.setuptools]
py-modules = ["kbconflict"]
